services:
  build:
    image: debian:trixie-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      sh -ec "
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends cmake build-essential git ninja-build libsdl2-dev libvorbis-dev libpng-dev libvpx-dev &&
        rm -rf build.lin.amd64 &&
        cmake -DBUILD_LINUX=ON -DTARGET_ARCH=AMD64 -DCMAKE_BUILD_TYPE=Release -S . -B build.lin.amd64 &&
        cmake --build build.lin.amd64 --config Release -- -j$$(nproc) &&
        gcc -o /tmp/borpak tools/borpak/source/borpak.c tools/borpak/source/stristr.c &&
        /tmp/borpak -b -d mods/Demo engine/releases/LINUX/Paks/Demo.pak &&
        echo 'BUILD SUCCESSFUL' &&
        ls -la engine/releases/LINUX/ engine/releases/LINUX/Paks/
      "
